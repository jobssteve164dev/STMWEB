name: Compiler image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable compiler environment version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stmweb-compiler-image
  cancel-in-progress: false

jobs:
  publish-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate immutable version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v1.2.3" >&2; exit 2; }
          if git ls-remote --exit-code --tags origin "refs/tags/compiler-env-$VERSION" >/dev/null 2>&1; then
            echo "compiler environment version already exists" >&2
            exit 3
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/image/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: stmweb/compiler:${{ inputs.version }}
      - name: Export immutable environment
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/build-compiler-environment-release.sh "$VERSION" "$RUNNER_TEMP/compiler-environment" "$GITHUB_SHA"
      - name: Verify release contract
        run: |
          node scripts/check-compiler-environment.mjs
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' stmweb/compiler:${{ inputs.version }})" = "linux/amd64"
          sha256sum -c <(node -e 'const m=require(process.argv[1]); console.log(`${m.artifact.sha256}  ${{ runner.temp }}/compiler-environment/${m.artifact.asset}`)' "${{ runner.temp }}/compiler-environment/manifest.json")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: compiler-env-${{ inputs.version }}
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/compiler-environment/manifest.json
            ${{ runner.temp }}/compiler-environment/stmweb-compiler-${{ inputs.version }}-linux-amd64.tar.gz
            ${{ runner.temp }}/compiler-environment/build-evidence.txt
