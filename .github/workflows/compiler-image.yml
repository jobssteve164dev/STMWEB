name: Compiler image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable compiler environment version
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: stmweb-compiler-image
  cancel-in-progress: false

jobs:
  publish-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v1.2.3" >&2; exit 2; }
      - uses: docker/build-push-action@v6
        with:
          context: runner/image
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/jobssteve164dev/stmweb-build-arm-gcc:${{ inputs.version }}
