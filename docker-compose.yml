x-gitops:
  public_entry:
    service: web
    container_port: 8080
    healthcheck:
      path: /health
      expected_json:
        status: ok

services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://stmweb.szlk.uk}
      STMWEB_ADMIN_USERNAME: ${STMWEB_ADMIN_USERNAME:-}
      STMWEB_ADMIN_PASSWORD: ${STMWEB_ADMIN_PASSWORD:-}
      STMWEB_BUILD_IMAGE: ${STMWEB_BUILD_IMAGE:-stmweb/compiler:v0.2.0}
      STMWEB_BUILD_IMAGE_ID: ${STMWEB_BUILD_IMAGE_ID:-}
      CLOUDMCP_BRIDGE_CLIENT_ID: ${CLOUDMCP_BRIDGE_CLIENT_ID:-}
      CLOUDMCP_BRIDGE_CLIENT_SECRET: ${CLOUDMCP_BRIDGE_CLIENT_SECRET:-}
      CLOUDMCP_BRIDGE_CLIENT_SECRET_NEXT: ${CLOUDMCP_BRIDGE_CLIENT_SECRET_NEXT:-}
      STMWEB_CLOUDMCP_SOURCE_REPOSITORIES: ${STMWEB_CLOUDMCP_SOURCE_REPOSITORIES:-jobssteve164dev/STMWEB}
    ports:
      - "8080:8080"
