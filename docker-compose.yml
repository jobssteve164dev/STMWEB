services:
  web:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://stmweb.szlk.uk}
      STMWEB_ADMIN_USERNAME: ${STMWEB_ADMIN_USERNAME:-}
      STMWEB_ADMIN_PASSWORD: ${STMWEB_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
